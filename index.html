<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Debug the Code – C Challenge</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--text:#1b1f2a;--muted:#5d6577;--line:#d9dde7;--accent:#3b5bdb;--code:#10131c;--codetext:#e6e9f2;--ok:#1a7f4b;--bad:#c92a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1117;--card:#181b25;--text:#e8eaf2;--muted:#9aa2b5;--line:#2a2f3d;--accent:#7c93ff;--code:#0a0c12;--codetext:#e6e9f2;--ok:#4ade80;--bad:#ff6b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1117;--card:#181b25;--text:#e8eaf2;--muted:#9aa2b5;--line:#2a2f3d;--accent:#7c93ff;--code:#0a0c12;--codetext:#e6e9f2;--ok:#4ade80;--bad:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.4rem;margin:0}
.sub{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.q{font-weight:700;font-size:1.1rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
textarea{width:100%;min-height:260px;margin-top:10px;background:var(--code);color:var(--codetext);border:1px solid var(--line);border-radius:10px;padding:12px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;tab-size:4}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button:hover{filter:brightness(1.08)}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;display:none}
.msg.show{display:block}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.msg.info{color:var(--text)}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.big textarea{font-size:22px;min-height:340px}
.big .msg{font-size:1.2rem}
.score{font-weight:600}
input[type=text]{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-top:6px}
.lbl{display:block;margin-top:12px;font-weight:600;font-size:.9rem}
#addp textarea{min-height:150px;font-size:14px}
#addp input[type=file]{margin-top:6px;font-size:.85rem;color:var(--muted)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fly,.rise{position:absolute;font-size:30px;font-weight:700;color:var(--accent);opacity:0;will-change:transform,opacity;font-family:ui-monospace,Menlo,Consolas,monospace}
.big~#fx .fly,.big~#fx .rise{font-size:46px}
.fly{animation:fly var(--d) cubic-bezier(.2,.8,.3,1) forwards}
.rise{bottom:-50px;animation:rise var(--d) ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}15%{opacity:1;transform:translate(calc(-50% + var(--x)*.7),calc(-50% + var(--y)*.7)) scale(1.3) rotate(calc(var(--r)*.4))}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y) + 280px)) scale(.9) rotate(var(--r));opacity:0}}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(-115vh) rotate(var(--r));opacity:0}}
@keyframes pop{0%{transform:scale(.85)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.msg.ok.pop{animation:pop .5s ease-out}
.msg.bad.shake{animation:shake .4s}
@media (prefers-reduced-motion:reduce){.msg.pop,.msg.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <header>
    <div>
      <h1>🐞 Debug the Code – C</h1>
      <div class="sub">Find the Bug and fix it</div>
    </div>
    <div class="btns" style="margin:0">
      <button id="addBtn">➕ Add question</button>
      <button id="bigBtn">🖥️ Projector mode</button>
      <span class="score" id="score"></span>
    </div>
  </header>

  <div class="card">
    <div class="top">
      <div class="q" id="qtitle"></div>
      <div class="timer" id="timer">00:00</div>
    </div>
    <div class="sub" id="task" style="margin-top:4px"></div>
    <textarea id="code" spellcheck="false"></textarea>
    <div class="btns">
      <button class="p" id="runbug">▶ Run code</button>
      <button id="hint">💡 Hint</button>
      <button id="del" style="display:none">🗑 Delete this question</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="addp" style="display:none">
    <div class="q">➕ Add your own question</div>
    <div class="sub">Type or upload a .c file. The correct code is run automatically to get the expected output.</div>
    <label class="lbl">Title (optional)</label>
    <input type="text" id="ntitle" placeholder="e.g. Pointer swap">
    <label class="lbl">Buggy code (students will see this)</label>
    <textarea id="nbug" spellcheck="false" placeholder="Paste buggy C code here"></textarea>
    <input type="file" id="fbug" accept=".c,.txt,text/plain">
    <label class="lbl">Correct code</label>
    <textarea id="nfix" spellcheck="false" placeholder="Paste the correct C code here"></textarea>
    <input type="file" id="ffix" accept=".c,.txt,text/plain">
    <label class="lbl">Hint (optional, English)</label>
    <input type="text" id="nhint" placeholder="e.g. Check the loop condition">
    <div class="btns">
      <button class="p" id="saveq">Save question</button>
      <button id="cancelq">Cancel</button>
    </div>
    <div class="msg" id="nmsg"></div>
  </div>

  <div class="nav">
    <button id="prev">← Previous</button>
    <span class="sub" id="pos"></span>
    <button id="next">Next →</button>
  </div>
</div>
<div id="fx"></div>

var Q = [
{t:"Missing something…",task:"Missing Something?",
 bug:String.raw`#include <stdio.h>
int main() {
    int a = 5, b = 7

    return 0;

 fix:String.raw`#include <stdio.h>
int main() {
    int a = 5, b = 7;
    printf("Sum = %d\n", a + b);
    return 0;
}`,
 err:"error: expected ‘;’ before ‘printf’",out:"Sum = 12",hint:"Look at line 3. How should a statement end in C?"},

{t:"Wrong format specifier",task:"Price 99.5 print aaganum, but garbage varuthu.",
 bug:String.raw`#include <stdio.h>
int main() {
    float price = 99.5;
    printf("Price = %d\n", price);
    return 0;
}`,
 fix:String.raw`#include <stdio.h>
int main() {
    float price = 99.5;
    printf("Price = %f\n", price);
    return 0;
}`,
 err:"Output: Price = 0   (garbage / wrong value)",out:"Price = 99.500000",okRe:/^Price = 99\.5\d*$/,hint:"Which format specifier prints a float? %d is only for integers."},

{t:"One equals or two?",task:"n = 5. Output “Not ten” varanum, but “Ten” varuthu!",
 bug:String.raw`#include <stdio.h>
int main() {
    int n = 5;
    if (n = 10)
        printf("Ten\n");
    else
        printf("Not ten\n");
    return 0;
}`,
 fix:String.raw`#include <stdio.h>
int main() {
    int n = 5;
    if (n == 10)
        printf("Ten\n");
    else
        printf("Not ten\n");
    return 0;
}`,
 err:"Output: Ten   (wrong! n is 5)",out:"Not ten",hint:"The if condition assigns a value instead of comparing. Which operator compares two values?"},

{t:"Loop never ends",task:"1 to 5 print aaganum, but program stop aagala.",
 bug:String.raw`#include <stdio.h>
int main() {
    int i;
    for (i = 1; i <= 5; i--) {
        printf("%d ", i);
    }
    return 0;
}`,
 fix:String.raw`#include <stdio.h>
int main() {
    int i;
    for (i = 1; i <= 5; i++) {
        printf("%d ", i);
    }
    return 0;
}`,
 err:"Output: 1 0 -1 -2 -3 ... (infinite loop)",out:"1 2 3 4 5",hint:"Check the loop update. Is i increasing or decreasing?"},

{t:"Out of bounds",task:"Sum 15 varanum. Oru extra element add aaguthu.",
 bug:String.raw`#include <stdio.h>
int main() {
    int a[5] = {1, 2, 3, 4, 5};
    int i, sum = 0;
    for (i = 0; i <= 5; i++)
        sum += a[i];
    printf("Sum = %d\n", sum);
    return 0;
}`,
 fix:String.raw`#include <stdio.h>
int main() {
    int a[5] = {1, 2, 3, 4, 5};
    int i, sum = 0;
    for (i = 0; i < 5; i++)
        sum += a[i];
    printf("Sum = %d\n", sum);
    return 0;
}`,
 err:"Output: Sum = garbage value (a[5] doesn’t exist)",out:"Sum = 15",hint:"An array of size 5 has valid indexes 0 to what?"},

{t:"Uninitialized variable",task:"5! = 120 varanum, but random number varuthu.",
 bug:String.raw`#include <stdio.h>
int main() {
    int i, fact;
    for (i = 1; i <= 5; i++)
        fact = fact * i;
    printf("Factorial = %d\n", fact);
    return 0;
}`,
 fix:String.raw`#include <stdio.h>
int main() {
    int i, fact = 1;
    for (i = 1; i <= 5; i++)
        fact = fact * i;
    printf("Factorial = %d\n", fact);
    return 0;
}`,
 err:"Output: Factorial = garbage value",out:"Factorial = 120",hint:"fact has no starting value. What should it start with when you are multiplying?"},

{t:"The sneaky semicolon",task:"“Hi” 3 time varanum, but 1 time mattum varuthu.",
 bug:String.raw`#include <stdio.h>
int main() {
    int i;
    for (i = 1; i <= 3; i++);
        printf("Hi\n");
    return 0;
}`,
 fix:String.raw`#include <stdio.h>
int main() {
    int i;
    for (i = 1; i <= 3; i++)
        printf("Hi\n");
    return 0;
}`,
 err:"Output: Hi   (only once)",out:"Hi\nHi\nHi",hint:"Look at the end of the for line. There is one extra character."},

{t:"Switch fall-through",task:"day = 2 na “Tue” mattum varanum.",
 bug:String.raw`#include <stdio.h>
int main() {
    int day = 2;
    switch (day) {
        case 1: printf("Mon\n"); break;
        case 2: printf("Tue\n");
        case 3: printf("Wed\n"); break;
    }
    return 0;
}`,
 fix:String.raw`#include <stdio.h>
int main() {
    int day = 2;
    switch (day) {
        case 1: printf("Mon\n"); break;
        case 2: printf("Tue\n"); break;
        case 3: printf("Wed\n"); break;
    }
    return 0;
}`,
 err:"Output: Tue\nWed   (falls through)",out:"Tue",hint:"After case 2 prints, execution continues into the next case. What stops it?"}
];
var cur=0, secs=0, tmr=null, solved={};
var $=function(i){return document.getElementById(i)};
function norm(s){return s.replace(/\s+/g,"")}
function show(t,c){var m=$("msg");m.textContent=t;m.className="msg show "+c;void m.offsetWidth;if(c==="ok")m.className+=" pop";else if(c==="bad")m.className+=" shake"}
function hide(){$("msg").className="msg"}
function fmt(n){return ("0"+Math.floor(n/60)).slice(-2)+":"+("0"+(n%60)).slice(-2)}
function load(i){
  cur=i;var q=Q[i];
  $("qtitle").textContent="Q"+(i+1)+". "+q.t;
  $("task").textContent=q.task;
  $("code").value=q.bug;
  $("pos").textContent=(i+1)+" / "+Q.length;$("del").style.display=q.custom?"":"none";
  hide();secs=0;$("timer").textContent="00:00";
  clearInterval(tmr);tmr=setInterval(function(){secs++;$("timer").textContent=fmt(secs)},1000);
  upScore();
}
function upScore(){var n=Object.keys(solved).length;$("score").textContent="Solved: "+n+" / "+Q.length}
function runC(src){var out="";try{JSCPP.run(src,"",{stdio:{write:function(x){out+=x}},maxTimeout:3000});return{ok:true,out:out}}catch(e){return{ok:false,out:out,err:String(e&&e.message||e)}}}
function clip(t){return t.length>300?t.slice(0,300)+"\n…(output cut)":t}
$("runbug").onclick=function(){
  var q=Q[cur],r=runC($("code").value);
  if(r.ok){
    var t=r.out.trim(),same=q.okRe?q.okRe.test(t):t===q.out.trim();
    if(same&&norm($("code").value)!==norm(q.bug)){solved[cur]=1;upScore();clearInterval(tmr);show("$ ./a.out\n"+clip(r.out)+"\n\n✅ Correct! Fixed in "+fmt(secs),"ok");celebrate()}
    else show("$ ./a.out\n"+clip(r.out)+"\n\n(Program finished)","info")
  }else{
    var e=r.err.replace(/\n-{5,}[\s\S]*$/,""),ln=e.match(/line (\d+)/);
    if(/Parsing Failure/.test(e))e="Syntax error near line "+(ln?ln[1]:"?")+". Check semicolons, brackets and spelling.";
    if(/Time limit/i.test(e))e="Infinite loop! The program did not stop (time limit exceeded).";
    show((r.out?"Output so far:\n"+clip(r.out)+"\n\n":"")+"❌ Error: "+e,"bad")
  }
};
$("hint").onclick=function(){show("💡 "+Q[cur].hint,"info")};
$("prev").onclick=function(){if(cur>0)load(cur-1)};
$("next").onclick=function(){if(cur<Q.length-1)load(cur+1)};
$("bigBtn").onclick=function(){var r=$("root");r.classList.toggle("big");$("bigBtn").textContent=r.classList.contains("big")?"🖥️ Normal mode":"🖥️ Projector mode"};
$("code").addEventListener("keydown",function(e){if(e.key==="Tab"){e.preventDefault();var t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+"    "+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+4}});

var DOO=["🎉","⭐","✨","🐞","💡","🚀","💻","🔥","👏","✅","{ }",";","++","&","*","#","==","</>","0x1F"];
function celebrate(){
  try{
    if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    var fx=$("fx"),b=$("msg").getBoundingClientRect(),ox=b.left+b.width/2,oy=b.top+Math.min(b.height/2,60),i,e,a,d;
    function add(el,ms){fx.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},ms)}
    for(i=0;i<30;i++){
      e=document.createElement("span");e.className="fly";e.textContent=DOO[Math.floor(Math.random()*DOO.length)];
      a=Math.random()*Math.PI*2;d=100+Math.random()*280;
      e.style.left=ox+"px";e.style.top=oy+"px";
      e.style.setProperty("--x",Math.cos(a)*d+"px");e.style.setProperty("--y",(Math.sin(a)*d*.8-120)+"px");
      e.style.setProperty("--r",(Math.random()*720-360)+"deg");e.style.setProperty("--d",(1.8+Math.random()*1.2)+"s");
      add(e,3200)
    }
    for(i=0;i<16;i++){
      e=document.createElement("span");e.className="rise";e.textContent=DOO[Math.floor(Math.random()*DOO.length)];
      e.style.left=(Math.random()*95)+"%";e.style.animationDelay=(Math.random()*.8)+"s";
      e.style.setProperty("--r",(Math.random()*360-180)+"deg");e.style.setProperty("--d",(2.2+Math.random()*1.6)+"s");
      add(e,4800)
    }
  }catch(x){}
}
function saveCustom(){try{localStorage.setItem("dbg_custom",JSON.stringify(Q.filter(function(x){return x.custom})))}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem("dbg_custom")||"[]");if(Array.isArray(sv))sv.forEach(function(x){if(x&&x.bug&&x.fix&&typeof x.out==="string"){x.custom=true;Q.push(x)}})}catch(e){}
function nm(t){var m=$("nmsg");m.textContent=t;m.className="msg show bad"}
function pick(f,t){$(f).onchange=function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){$(t).value=r.result};r.readAsText(file)}}
pick("fbug","nbug");pick("ffix","nfix");
$("addBtn").onclick=function(){var a=$("addp");a.style.display=a.style.display==="none"?"block":"none"};
$("cancelq").onclick=function(){$("addp").style.display="none"};
$("saveq").onclick=function(){
  var bug=$("nbug").value,fix=$("nfix").value;
  if(!bug.trim()||!fix.trim()){nm("Please add both the buggy code and the correct code.");return}
  if(norm(bug)===norm(fix)){nm("The buggy code and the correct code are the same.");return}
  var r=runC(fix);
  if(!r.ok){var e=r.err.replace(/\n-{5,}[\s\S]*$/,"");nm("The correct code has an error: "+e.slice(0,160));return}
  if(!r.out.trim()){nm("The correct code prints nothing. Add a printf so the output can be checked.");return}
  Q.push({t:$("ntitle").value.trim()||"My question",task:"Find the bug and fix it.",bug:bug,fix:fix,out:r.out,hint:$("nhint").value.trim()||"Read the code line by line and trace the output.",custom:true});
  saveCustom();
  ["ntitle","nbug","nfix","nhint"].forEach(function(k){$(k).value=""});
  $("nmsg").className="msg";$("addp").style.display="none";load(Q.length-1)
};
$("del").onclick=function(){
  if(!Q[cur].custom)return;
  var ns={};Object.keys(solved).forEach(function(k){k=+k;if(k<cur)ns[k]=1;else if(k>cur)ns[k-1]=1});solved=ns;
  Q.splice(cur,1);saveCustom();load(Math.min(cur,Q.length-1))
};
load(0);
</script>
</body>
</html>
